name: Set up the workspace
description: pnpm and Node as package.json pins them, Bun, the frozen install and, on request, the JDK and kotlinc of the host checks.

# Used by ci.yml and release.yml after actions/checkout. The pins live here, once:
#   pnpm   the "packageManager" field of package.json (pnpm/action-setup reads it)
#   Node   "engines.node" / "devEngines.runtime" of package.json (actions/setup-node reads it)
#   Bun    bun-version below (the tests run on Bun; the same version as README.md "Install and check")

inputs:
  host-tools:
    description: Also install JDK 17, kotlinc 2.1.20 and the org.json jar, which the Kotlin and C++ host checks need (under CI=1 they fail, not skip, without them).
    default: "false"
  bun-version:
    description: The Bun version.
    default: "1.3.14"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: pnpm

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: JDK 17
      if: ${{ inputs.host-tools == 'true' }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    # kotlinc and the org.json jar are downloaded once per version of host-tools.sh and kept in this cache.
    - name: Cache kotlinc and the org.json jar
      if: ${{ inputs.host-tools == 'true' }}
      uses: actions/cache@v6
      with:
        path: ~/.cache/native-qa-host-tools
        key: native-qa-host-tools-${{ hashFiles('apps/qa/qa/ci/host-tools.sh') }}

    # A pinned kotlinc (2.1.20, the Kotlin the Android build compiles with) and the org.json jar, each checked against a sha256. It puts
    # kotlinc on PATH and sets ORG_JSON_JAR for the steps after it. g++ and the Android SDK's android.jar (ANDROID_HOME) come with the
    # hosted image.
    - name: Install kotlinc and the org.json jar
      if: ${{ inputs.host-tools == 'true' }}
      shell: bash
      run: bash apps/qa/qa/ci/host-tools.sh
