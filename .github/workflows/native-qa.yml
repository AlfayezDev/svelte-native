name: native-qa

# The Android emulator lane (and the crash volume) of the QA harness, on the self-hosted runner next to the emulator on the OVH host.
# The static checks (lint, types, unit tests, host checks) are ci.yml; the build from a consumer's side is consumer.yml.
# What runs, what blocks, how to read a failure and what it costs: apps/qa/qa/README.md, "CI".
# Registering the runner and switching the lane on: apps/qa/qa/ci/RUNBOOK.md. Until the repository variable QA_EMULATOR_RUNNER is "true" no
# job here runs (a push shows this workflow as skipped), so nothing waits for a runner that does not exist.

on:
  push:
    # Branches only: the tag of a release is built by release.yml. A push that only touches documentation does not need an emulator.
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "deploy/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      repeat:
        description: Lab runs (the production bar is 10 consecutive complete runs)
        default: "10"
      warm:
        description: Warm boot launches (the production bar is 30)
        default: "30"
      cold:
        description: Cold boot launches (the production bar is 30)
        default: "30"
      smoke:
        description: Build and run the native module smoke app
        type: boolean
        default: true
      updates:
        description: Also run the over-the-air update scenario (native-qa updates). It PUBLISHES updates to the EAS channel below, so a push never does; needs the EXPO_TOKEN secret
        type: boolean
        default: false
      updates_channel:
        description: The EAS Update channel of the update scenario (qa, or qa-<suffix>). A run from another machine on the same channel waits for this one (the channel lock is a lock of the OVH host, like the emulator's)
        default: qa
      crashes:
        description: Also run the crash volume, 1,000 cold starts and 100 suites (8 to 15 hours of the emulator)
        type: boolean
        default: false
  # The crash volume weekly, if wanted (it holds the shared emulator for most of a day; set `crashes` above for one run):
  # schedule:
  #   - cron: "0 22 * * 6"

permissions:
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  # A dispatch while the runner is not enabled says so instead of finishing green with nothing run.
  runner-missing:
    name: Emulator runner not enabled
    if: ${{ github.event_name == 'workflow_dispatch' && vars.QA_EMULATOR_RUNNER != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error title=No emulator runner::the repository variable QA_EMULATOR_RUNNER is not \"true\". Register the self-hosted runner (apps/qa/qa/ci/RUNBOOK.md) and set it; no emulator job ran."
          exit 1

  emulator:
    name: Android emulator lane
    # The runner has to exist: a job for a label no runner has stays queued until GitHub gives up after 24 hours.
    if: ${{ vars.QA_EMULATOR_RUNNER == 'true' }}
    runs-on: [self-hosted, svelte-qa-emulator]
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 480 || 180 }}
    # One emulator: runs queue instead of cancelling each other. GitHub keeps one running and the newest pending run in a group,
    # so a run that a newer push replaced before it started shows as cancelled: nothing ran, nothing failed.
    concurrency:
      group: native-qa-emulator
      cancel-in-progress: false
    env:
      QA_DEVICE: localhost:5555
      QA_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'push' }}
      QA_REPEAT: ${{ inputs.repeat || '3' }}
      QA_WARM: ${{ inputs.warm || '30' }}
      QA_COLD: ${{ inputs.cold || '30' }}
      QA_SMOKE: ${{ inputs.smoke && '1' || '0' }}
      # The update scenario publishes to EAS: dispatch only, never on a push (lane.sh also ignores it outside the full mode).
      QA_UPDATES: ${{ github.event_name == 'workflow_dispatch' && inputs.updates && '1' || '0' }}
      QA_CHANNEL: ${{ inputs.updates_channel || 'qa' }}
      # Seconds to wait for the emulator lock before the lane gives up (the job timeout counts this wait).
      QA_LOCK_WAIT: ${{ github.event_name == 'workflow_dispatch' && '10800' || '5400' }}
    defaults:
      run:
        working-directory: apps/qa
    steps:
      # The runner's workspace is kept between runs, so Gradle, CMake and Metro build incrementally; lane.sh reset forgets the
      # last lane's run files, which the report would otherwise merge into this one.
      - uses: actions/checkout@v7
        with:
          clean: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Forget the previous lane
        run: bash qa/ci/lane.sh reset

      # Without the emulator lock: the build overlaps whatever else is using the emulator. x86_64 only, the QA app and then the product
      # (io.example.sveltenative.qaproduct, no development lab: the app the product boot check starts), on the runner's Gradle caches (GRADLE_USER_HOME).
      - name: Build the release APKs (x86_64)
        run: bash qa/ci/lane.sh build

      # The whole lane holds the emulator lock (the same file the agents' runs take over ssh): a fresh emulator instance, the
      # stages (the product boot check after those of the QA app), the report and the gates. Waits at most QA_LOCK_WAIT seconds for the lock.
      - name: Emulator lane
        run: node qa/native-qa.ts hold --device "$QA_DEVICE" --wait "$QA_LOCK_WAIT" -- bash qa/ci/lane.sh emulator
        env:
          # Only the step that publishes gets the token, and only when the dispatch asked for the update scenario.
          EXPO_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.updates && secrets.EXPO_TOKEN || '' }}

      - name: Job summary
        if: ${{ always() }}
        run: bash qa/ci/lane.sh summary

      - name: Upload run files, logs and report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-qa-emulator-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/qa/qa/report.json
            apps/qa/qa/runs/
            apps/qa/qa/out/*.log
            apps/qa/qa/out/build-*.json
            apps/qa/qa/out/lane-stages.tsv
            apps/qa/qa/out/gates*.md

  crashes:
    name: Crash volume
    if: ${{ vars.QA_EMULATOR_RUNNER == 'true' && github.event_name == 'workflow_dispatch' && inputs.crashes }}
    runs-on: [self-hosted, svelte-qa-emulator]
    timeout-minutes: 1200
    # Not the group of the lane: a crash volume waiting for the runner must not be replaced by the next push's lane.
    concurrency:
      group: native-qa-crashes
      cancel-in-progress: false
    env:
      QA_DEVICE: localhost:5555
    defaults:
      run:
        working-directory: apps/qa
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Forget the previous lane
        run: bash qa/ci/lane.sh reset

      # The crash volume starts the QA app only, so the product is not built (QA_ONLY narrows the lane's build to it).
      - name: Build the release APK (x86_64)
        run: bash qa/ci/lane.sh build
        env:
          QA_ONLY: crashes

      # No lock held across the volume: every chunk takes it, so the host's watchdog can restart the emulator between chunks.
      - name: 1,000 cold starts and 100 suites
        run: bash qa/ci/lane.sh crashes

      - name: Job summary
        if: ${{ always() }}
        run: bash qa/ci/lane.sh summary

      - name: Upload run files, logs and report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-qa-crashes-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/qa/qa/report.json
            apps/qa/qa/runs/
            apps/qa/qa/out/*.log
            apps/qa/qa/out/build-*.json
            apps/qa/qa/out/lane-stages.tsv
            apps/qa/qa/out/gates*.md
