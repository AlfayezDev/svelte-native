name: Release

# A tag `v<version>` makes a GitHub Release: the CI checks run first (ci.yml), then the release is created with the CHANGELOG section of
# the version as its notes and the `pnpm pack` tarball of packages/expo-svelte attached. Apps do not install the tarball: they depend on the
# tag itself (pnpm add "git+ssh://git@github.com/AlfayezDev/svelte-native.git#<tag>&path:packages/expo-svelte"); the tarball is a convenience.
# The steps for the person who releases: README.md, "Release".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: The tag names the package's version, and the changelog has it
        id: version
        run: |
          version=$(node -p 'require("./packages/expo-svelte/package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Tag and version differ::the tag is $TAG, packages/expo-svelte/package.json says $version. Set the version, commit, and tag that commit as v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md" || {
            echo "::error title=No changelog entry::packages/expo-svelte/CHANGELOG.md has no non-empty '## $version' section"
            exit 1
          }
          echo "release notes: $(wc -l < "$RUNNER_TEMP/notes.md") lines"

      # What `files` in package.json packs: src/, dist/node/, dist/types/, native/, patches/, the module config and the documents.
      - name: Pack the library
        run: |
          mkdir "$RUNNER_TEMP/assets"
          pnpm --dir packages/expo-svelte pack --pack-destination "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          sha256sum -- *.tgz | tee SHA256SUMS
          ls -l

      - name: Create the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          flags=(--title "expo-svelte $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          # 0.3.0-rc.1 is a pre-release; it is never the "latest" release.
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run of this workflow for the same tag: replace the notes and the files.
            gh release edit "$TAG" "${flags[@]}"
            gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/assets/* --verify-tag "${flags[@]}"
          fi
          gh release view "$TAG" --json url,isPrerelease,assets --jq '"\(.url) prerelease=\(.isPrerelease) assets=\([.assets[].name] | join(","))"'
