# This app's pnpm settings (pnpm reads them from this file; the app is its own workspace root).
allowBuilds:
  esbuild: true
# expo depends on expo-modules-core by range (~57.0.23), so a fresh install takes the newest 57.0.x; the patch below is for 57.0.23 only.
overrides:
  expo-modules-core: 57.0.23
# The library's patches, copied from node_modules/@example/svelte-native/patches/ into patches/svelte-native/ (README, "Apply the patches").
# Only the libraries this app installs; the view libraries' patches (lottie, maps, pdf, video) are declared when the app installs them.
patchedDependencies:
  "@sveltejs/kit@3.0.0-next.27": patches/svelte-native/@sveltejs__kit@3.0.0-next.27.patch
  expo-modules-core@57.0.23: patches/svelte-native/expo-modules-core@57.0.23.patch
  react-native-gesture-handler@2.32.0: patches/svelte-native/react-native-gesture-handler@2.32.0.patch
  react-native-reanimated@4.5.1: patches/svelte-native/react-native-reanimated@4.5.1.patch
  react-native-worklets@0.10.1: patches/svelte-native/react-native-worklets@0.10.1.patch
