# This app's pnpm settings (pnpm reads them from this file; the app is its own workspace root).
allowBuilds:
  esbuild: true
# expo depends on expo-modules-core by range (~58.1.0), so a fresh install takes the newest 58.1.x; the patch below is for 58.1.0 only.
# Packages of the tool chain ask for @react-native/metro-config by a range or any version: it stays at React Native's version.
overrides:
  expo-modules-core: 58.1.0
  "@react-native/metro-config": 0.88.1
# The library's patches, copied from node_modules/expo-svelte/patches/ into patches/expo-svelte/ (README, "Apply the patches").
# Only the libraries this app installs; the view libraries' patches (lottie, maps, pdf, video) are declared when the app installs them.
patchedDependencies:
  "@sveltejs/kit@3.1.1": patches/expo-svelte/@sveltejs__kit@3.1.1.patch
  expo-modules-core@58.1.0: patches/expo-svelte/expo-modules-core@58.1.0.patch
