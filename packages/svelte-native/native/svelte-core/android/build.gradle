import expo.modules.plugin.gradle.ExpoModuleExtension

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.sveltecore'
version = '0.1.0'

def expoModuleExtension = project.extensions.getByType(ExpoModuleExtension)

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
  if (rootProject.hasProperty("ndkPath")) {
    ndkPath rootProject.ext.ndkPath
  }
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  namespace "expo.modules.sveltecore"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // When the embedded bundle was built: the Gradle run that packages it is the run that evaluates this line. The update store compares
    // it with each update's `createdAt` to decide whether an update is newer than the bundle inside the app.
    buildConfigField "long", "BUILD_TIME_MS", "${System.currentTimeMillis()}L"
    // What the app's R8 is told about this library: Firebase Messaging is compile-time only here (below), so push's two classes that name it are not resolvable in an app without push.
    consumerProguardFiles "consumer-rules.pro"

    externalNativeBuild {
      cmake {
        arguments(
          "-DANDROID_STL=c++_shared",
          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
          "-DREACT_NATIVE_DIR=${expoModuleExtension.reactNativeDir}",
          "-DREACT_NATIVE_TARGET_VERSION=${expoModuleExtension.reactNativeVersion.minor}"
        )
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
    buildConfig true
  }

  lintOptions { abortOnError false }

  packagingOptions {
    // Intermediate link libraries from prefab; the app packages the real ones.
    excludes += [
      "**/libc++_shared.so",
      "**/libfabricjni.so",
      "**/libfbjni.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermesvm.so",
      "**/libjsi.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libreact_debug.so",
      "**/libreact_nativemodule_core.so",
      "**/libreact_utils.so",
      "**/libreact_render_debug.so",
      "**/libreact_render_graphics.so",
      "**/libreact_render_core.so",
      "**/libreact_render_componentregistry.so",
      "**/libreact_render_mapbuffer.so",
      "**/librrc_view.so",
      "**/libruntimeexecutor.so",
      "**/libyoga.so",
    ]
  }
}

// The library's native code, one Gradle project: the engine (Kotlin and the C++ of CMakeLists.txt), the update store, the blur view, the
// web APIs (fetch and Blob, the clipboard, location) and push. Each keeps its Kotlin package; the namespace (R, BuildConfig) is this project's.
dependencies {
  // React Native's own dependency list carries OkHttp and Okio as `api`, at the versions its networking is built against (fetch).
  implementation 'com.facebook.react:react-android'
  // The gesture handler's root helper and scroll hook (SPEC.md, "Gestures"). Compile time only: the library is in the app, and
  // the engine loads its classes when gestures are first enabled (`EngineGestures`; `EngineScroll` names one interface).
  compileOnly project(':react-native-gesture-handler')
  compileOnly 'com.facebook.fbjni:fbjni:0.5.1'
  // Push on Android (PUSH.md): the messaging service and the token calls. Compile time only, because this project is in every app and Firebase must be in none that has no push: the
  // config plugin adds the same dependency, at this version, to the app of `capabilities.push.android` (`pushFirebaseDependency` in `src/capabilities.ts`, which
  // `tests/package/push-native.test.ts` compares), and nothing here loads a Firebase class while push is off (`PushManifest.enabled`). An exact version: a message is delivered by this library's
  // service, and an app should get the one the library was exercised on. (Google's Maven, 11 Nov 2026.)
  compileOnly 'com.google.firebase:firebase-messaging:26.0.2'
  // Also location's: the platform's own LocationManager through LocationManagerCompat (`expo.modules.sveltelocation`), with no Google library, so it works on a phone without Google services.
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.annotation:annotation:1.9.1"
  implementation "androidx.activity:activity:1.10.1"
  implementation "androidx.tracing:tracing-ktx:1.2.0"
}
