apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.svelteupdates'
version = '0.1.0'

android {
  namespace "expo.modules.svelteupdates"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // When the embedded bundle was built: the Gradle run that packages it is the run that evaluates this line. The store compares
    // it with each update's `createdAt` to decide whether an update is newer than the bundle inside the app.
    buildConfigField "long", "BUILD_TIME_MS", "${System.currentTimeMillis()}L"
  }
  buildFeatures {
    buildConfig true
  }
  lintOptions { abortOnError false }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
