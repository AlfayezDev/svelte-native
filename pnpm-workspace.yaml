packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
verifyDepsBeforeRun: false
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 4320
peerDependencyRules:
  allowedVersions:
    "@sveltejs/kit": 3.0.0-next.27

allowBuilds:
  esbuild: true

catalog:
  "@types/react": ~19.2.17
  esbuild: 0.28.1
  react: 19.2.7
  vite: ^8.1.4
  valibot: ^1.4.2
overrides:
  react-dom: 19.2.7
  "@babel/core": 7.29.7
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
patchedDependencies:
  "@sveltejs/kit@3.0.0-next.27": packages/svelte-native/patches/@sveltejs__kit@3.0.0-next.27.patch
  expo-modules-core@57.0.23: patches/expo-modules-core@57.0.23.patch
  lottie-react-native@7.3.8: patches/lottie-react-native@7.3.8.patch
  react-native-gesture-handler@2.32.0: patches/react-native-gesture-handler@2.32.0.patch
  react-native-live-direction@0.1.1: patches/react-native-live-direction@0.1.1.patch
  react-native-maps@1.27.2: patches/react-native-maps@1.27.2.patch
  react-native-pdf@7.0.3: patches/react-native-pdf@7.0.3.patch
  react-native-reanimated@4.5.1: patches/react-native-reanimated@4.5.1.patch
  react-native-video@6.19.3: patches/react-native-video@6.19.3.patch
  react-native-worklets@0.10.1: patches/react-native-worklets@0.10.1.patch
